<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách nhóm trại</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <nav>
        <div class="logo">
            <a href="../index.html">
                <img src="../images/logo.png" alt="NGỜ YÊN NGHIÊNG">
            </a>
        </div>

        <button class="menu-toggle" type="button">
            ☰
        </button>

        <div class="menu">
            <a href="../index.html">Home</a>
            <a href="schedule.html">Lịch trình</a>
            <a href="confession.html">Confession</a>
            <a href="btc.html">BTC</a>
            <a href="groups.html" class="active">Danh sách nhóm</a>
            <a href="gallery.html">Khoảnh khắc</a>
        </div>
    </nav>

    <section class="page-title glass">
        <h1>🏕️ Danh sách nhóm</h1>
        <p>
            Tìm nhóm của bạn và cùng đồng hành trong suốt kỳ trại.
        </p>
    </section>

    <section class="groups">
        <div class="group-card">
            <h2>🟢 Nhóm 1</h2>
            <p><strong>👥 12 thành viên</strong></p>
            <div class="leader">
                <h3>👑 Trưởng nhóm: Nguyễn Thị Tường Vy</h3>
            </div>

            <hr>

            <ul class="member-list">
                <li>🙋 Nguyễn Văn A</li>
                <li>🙋 Trần Văn B</li>
                <li>🙋 Lê Văn C</li>
             </ul>
        </div>
    </section>

    <footer>
        <p>Designed & Developed by Diệp Đoan Trinh</p>
    </footer>

    <script>

        const toggle = document.querySelector(".menu-toggle");
        const menu = document.querySelector(".menu");

        // Mở / đóng menu
        toggle.addEventListener("click", () => {

            menu.classList.toggle("show");

            toggle.textContent =
                menu.classList.contains("show")
                    ? "✕"
                    : "☰";

        });

        // Bấm vào link thì đóng menu
        document.querySelectorAll(".menu a").forEach(link => {

            link.addEventListener("click", () => {

                menu.classList.remove("show");
                toggle.textContent = "☰";

            });

        });

        // Bấm ra ngoài thì đóng menu
        document.addEventListener("click", (e) => {

            if (
                !menu.contains(e.target) &&
                !toggle.contains(e.target)
            ) {

                menu.classList.remove("show");
                toggle.textContent = "☰";

            }

        });
    </script>
</body>

</html>
